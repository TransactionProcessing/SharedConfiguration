name: Release

on:
  release:
    types: [published]

jobs:
  buildlinux:
    name: "Build Linux Docker"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2.3.4

    - name: Get the version
      id: get_version
      run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

    - name: Build Docker Images 
      run: |
        docker build . --file Dockerfile --tag stuartferguson/txnprocbase:latest --tag stuartferguson/txnprocbase:${{ steps.get_version.outputs.VERSION }}

    - name: Publish Images to Docker Hub
      run: |
        docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
        docker push stuartferguson/txnprocbase:latest
        docker push stuartferguson/txnprocbase:${{ steps.get_version.outputs.VERSION }}
   
  buildwindows:
    name: "Build Windows Docker"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2.3.4

    - name: Get the version
      id: get_version
      uses: battila7/get-version-action@v2
      
    - name: Build Docker Images 
      run: |
        docker build . --file DockerfileWindows --tag stuartferguson/txnprocbasewindows:latest --tag stuartferguson/txnprocbasewindows:${{ steps.get_version.outputs.version }}

    - name: Publish Images to Docker Hub
      run: |
        docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
        docker push stuartferguson/txnprocbasewindows:latest
        docker push stuartferguson/txnprocbasewindows:${{ steps.get_version.outputs.version }}
  
  buildconfigpackage:
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
    - uses: actions/checkout@v2.3.4
    
    - name: Build Config Package
      run: |
         cd ./config
         zip -r ../sharedconfig.zip ./*

    - name: Upload the artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: sharedconfig
        path: sharedconfig.zip

  parse-deploy-body:
    runs-on: ubuntu-latest
    outputs:
      deploy_linux: ${{ steps.set.outputs.deploy_linux }}
      deploy_windows: ${{ steps.set.outputs.deploy_windows }}
    steps:
      - name: Parse deployment targets from release body
        id: set
        run: |
          body="${{ github.event.release.body }}"
          targets=$(echo "$body" | grep -i '^deploy:' | cut -d':' -f2 | tr -d ' ' | tr '[:upper:]' '[:lower:]')

          if [[ "$targets" == *"linux"* ]]; then
            echo "deploy_linux=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_linux=false" >> $GITHUB_OUTPUT
          fi

          if [[ "$targets" == *"windows"* ]]; then
            echo "deploy_windows=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_windows=false" >> $GITHUB_OUTPUT
          fi

  deploystaging_windows:
     needs: parse-deploy-body
     if: needs.parse-deploy-body.outputs.deploy_linux == 'true'
     runs-on: [stagingserver, windows]
     needs: buildconfigpackage
     environment: staging
     name: "Deploy to Staging"

     steps:
     - name: Download the artifact
       uses: actions/download-artifact@v4.1.7
       with:
          name: sharedconfig
          
     - name: deploy config
       run: |
          Expand-Archive -Path sharedconfig.zip -DestinationPath "C:\home\txnproc\config" -Force

  deploystaging_linux:
     needs: parse-deploy-body
     if: needs.parse-deploy-body.outputs.deploy_linux == 'true'
     runs-on: [stagingserver, linux]
     needs: buildconfigpackage
     environment: staging
     name: "Deploy to Staging"

     steps:
     - name: Download the artifact
       uses: actions/download-artifact@v4.1.7
       with:
          name: sharedconfig
          
     - name: deploy config
       run: |
           unzip sharedconfig.zip -d /home/txnproc/config

  deployproduction_windows:
     needs: parse-deploy-body
     if: needs.parse-deploy-body.outputs.deploy_linux == 'true'     
     runs-on: [productionserver, windows]
     needs: [buildconfigpackage, deploystaging_windows]
     environment: production
     name: "Deploy to Production"
    
     steps:
     - name: Download the artifact
       uses: actions/download-artifact@v4.1.7
       with:
          name: sharedconfig
          
     - name: deploy config
       run: |
          Expand-Archive -Path sharedconfig.zip -DestinationPath "C:\home\txnproc\config" -Force

  deployproduction_linux:
     needs: parse-deploy-body
     if: needs.parse-deploy-body.outputs.deploy_linux == 'true'     
     runs-on: [productionserver, linux]
     needs: [buildconfigpackage, deploystaging_linux]
     environment: production
     name: "Deploy to Production"
    
     steps:
     - name: Download the artifact
       uses: actions/download-artifact@v4.1.7
       with:
          name: sharedconfig
          
     - name: deploy config
       run: |
           unzip sharedconfig.zip -d /home/txnproc/config
