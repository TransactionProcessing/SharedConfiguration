name: Deploy Development Configuration

on:
  push:
    branches:
      - main

jobs:
  buildlinux:
    name: "Build Linux Docker"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2.3.4

    - name: Get the version
      id: get_version
      run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

    - name: Build Docker Images 
      run: |
        docker build . --file Dockerfile --tag stuartferguson/txnprocbase:latest --tag stuartferguson/txnprocbase:${{ steps.get_version.outputs.VERSION }}

    - name: Publish Images to Docker Hub
      run: |
        docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
        docker push stuartferguson/txnprocbase:latest
        docker push stuartferguson/txnprocbase:${{ steps.get_version.outputs.VERSION }}

  buildconfigpackage:
    name: Build Config Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Package configuration files
        run: cd config && zip -r ../sharedconfig.zip .

      - name: Upload configuration package
        uses: actions/upload-artifact@v4
        with:
          name: sharedconfig
          path: sharedconfig.zip

  deploydevelopment:
    name: Deploy to Development on Windows
    runs-on: [developmentserver, windows]
    needs: [buildconfigpackage]
    environment: development
    permissions: {}
    steps:
      - name: Download configuration package
        uses: actions/download-artifact@v4
        with:
          name: sharedconfig

      - name: Deploy configuration
        shell: cmd
        run: |
          set TARGET=C:\home\txnproc\config
          if not exist "%TARGET%" mkdir "%TARGET%"
          powershell -Command "Expand-Archive -Path 'sharedconfig.zip' -DestinationPath '%TARGET%' -Force"
